name: Daily cs.AI Frontier Lakehouse & UMAP Build

on:
  schedule:
    # Runs Mon-Fri at 04:30 UTC (30 mins after the 04:00 UTC AWS Lambda crawler)
    - cron: "30 4 * * 1-5"
  workflow_dispatch: # Lets you trigger a build manually with 1 click on GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU PyTorch & Pipeline Dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Run dbt Staging & Quality Tests over S3 Bronze
        run: |
          dbt run --profiles-dir .
          dbt test --profiles-dir .

      - name: Compute Embeddings, Polar UMAP & Bounded Novelty
        run: python3 pipeline/build_frontier.py

      - name: Publish Updated Web Bundle to S3 & Invalidate CloudFront
        run: |
          aws s3 sync web/ s3://arxiv-frontier-lake-sjarko-2026/public-web/
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[0].Id" --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/frontier_graph.json" "/index.html"

      - name: Compute Embeddings, Polar UMAP & Bounded Novelty
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 pipeline/build_frontier.py